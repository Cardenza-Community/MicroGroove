[platformio]
src_dir = .
default_envs = unified
[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_src_filter = +<*>
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Cardputer@1.1.1
    https://github.com/203Null/M5Unified.git#74fe31c6d9a2bd7c04f81eb4f8f0af99262e3bc2
    m5stack/M5GFX@0.2.31

[env:unified]
extends = env:cardputer
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stack-stamps3
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
extra_scripts =
build_flags =
    ${env:cardputer.build_flags}
    -Wl,--wrap=esp_partition_erase_range
lib_deps =
    m5stack/M5Cardputer@1.1.1
    https://github.com/203Null/M5Unified.git#74fe31c6d9a2bd7c04f81eb4f8f0af99262e3bc2
    m5stack/M5GFX@0.2.31

; Compatibility name for the existing Launcher CI; identical runtime-aware firmware.
[env:cardenza]
extends = env:unified
